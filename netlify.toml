[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.87.0"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true

# Publication folders were renamed in Nov 2026 to firstAuthor[EtAl]Year_topic
# (e.g. PSYX2022 -> davisEtAl2023_indirectProsociality). These keep old links working.
# Hugo lowercases the folder part of each URL; PDF filenames keep their capitals.
# Each PDF rule must stay above its folder catch-all rule.

# CDI2026 -> carlson2026_dialogueSkillsAI
[[redirects]]
  from = "/publication/cdi2026/CDI2026.pdf"
  to = "/publication/carlson2026_dialogueskillsai/carlson2026_dialogueSkillsAI.pdf"
  status = 301
[[redirects]]
  from = "/publication/cdi2026/*"
  to = "/publication/carlson2026_dialogueskillsai/:splat"
  status = 301

